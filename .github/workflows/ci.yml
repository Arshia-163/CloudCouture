name: CI — Build & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Backend ─────────────────────────────────────────────────
  backend-check:
    name: Backend — install & syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show repo structure (debug)
        run: find . -maxdepth 3 -name "package.json" | grep -v node_modules

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Syntax check (node --check)
        working-directory: backend
        run: node --check server.js

  # ── Job 2: Frontend ────────────────────────────────────────────────
  frontend-build:
    name: Frontend — lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (Vite)
        working-directory: frontend
        env:
          VITE_BACKEND_URL: http://localhost:4000
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build

  # ── Job 3: Admin ───────────────────────────────────────────────────
  admin-build:
    name: Admin — lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install admin dependencies
        working-directory: admin
        run: npm install

      - name: Build admin panel (Vite)
        working-directory: admin
        env:
          VITE_BACKEND_URL: http://localhost:4000
        run: npm run build